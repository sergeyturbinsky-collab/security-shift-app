<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">

<body>
<div id="root"></div>
<style id="app-style">
html, body { margin: 0; padding: 0; background: #12151a; }
.wrap {
  --bg: #12151a;
  --panel: #1b1f26;
  --panel-alt: #20252d;
  --border: #2b313b;
  --text: #edebe6;
  --muted: #9aa3ad;
  --amber: #e8a33d;
  --amber-dim: #6b4e22;
  --teal: #4fb3a9;
  --danger: #d9564a;
  font-family: 'Assistant', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 24px 16px 40px;
  box-sizing: border-box;
}
.wrap * { box-sizing: border-box; }
.shell { max-width: 720px; margin: 0 auto; }
.eyebrow {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  letter-spacing: 0.12em;
  color: var(--amber);
  text-transform: uppercase;
  margin-bottom: 6px;
}
.title {
  font-family: 'Suez One', serif;
  font-size: 30px;
  margin: 0 0 6px;
  color: var(--text);
  text-wrap: balance;
}
.date-display {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 18px;
}
.conn-note {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: var(--muted);
  margin: -10px 0 16px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.conn-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--teal); flex: none; }
.conn-note.conn-warn .conn-dot { background: var(--danger); }
.conn-note.conn-warn { color: var(--danger); }
.console-strip {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
}
.segment {
  flex: 1;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px 8px;
  text-align: center;
  cursor: default;
  transition: border-color 0.2s, background 0.2s;
}
.segment.active {
  border-color: var(--amber);
  background: linear-gradient(180deg, rgba(232,163,61,0.14), rgba(232,163,61,0.03));
}
.segment.done { cursor: pointer; }
.segment .dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--border);
  margin: 0 auto 6px;
}
.segment.active .dot, .segment.done .dot { background: var(--amber); }
.segment .seg-label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: var(--muted);
}
.segment.active .seg-label, .segment.done .seg-label { color: var(--text); }
.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 22px;
}
.panel h2 {
  font-family: 'Suez One', serif;
  font-size: 20px;
  margin: 0 0 16px;
  font-weight: normal;
  text-wrap: balance;
}
.grid-6 {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}
@media (min-width: 480px) {
  .grid-6 { grid-template-columns: repeat(3, 1fr); }
}
.choice-btn {
  background: var(--panel-alt);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 14px 10px;
  border-radius: 8px;
  font-family: 'Assistant', sans-serif;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: border-color 0.15s, transform 0.1s;
}
.choice-btn:hover { border-color: var(--amber); }
.choice-btn:active { transform: scale(0.98); }
.choice-btn:focus-visible, .btn-primary:focus-visible, .btn-secondary:focus-visible,
.icon-btn:focus-visible, .sector-tag:focus-visible, .history-toggle:focus-visible,
.btn-icon-add:focus-visible, .input:focus-visible {
  outline: 2px solid var(--teal);
  outline-offset: 2px;
}
.choice-btn.choice-btn-selected {
  border-color: var(--amber);
  background: linear-gradient(180deg, rgba(232,163,61,0.14), rgba(232,163,61,0.03));
}
.field-row { margin-bottom: 12px; }
.field-label {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 6px;
}
.field-label svg { width: 15px; height: 15px; }
.input {
  width: 100%;
  background: var(--panel-alt);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 10px 12px;
  border-radius: 7px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 14px;
}
.input:focus { outline: none; border-color: var(--amber); }
.input.name-input { font-family: 'Assistant', sans-serif; }
.input.input-empty { border-color: rgba(217,86,74,0.45); }
.field-hint {
  font-size: 12px;
  color: var(--danger);
  margin: -4px 0 14px;
}
.btn-primary {
  background: var(--amber);
  color: #1a1508;
  border: none;
  padding: 11px 20px;
  border-radius: 7px;
  font-family: 'Assistant', sans-serif;
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
}
.btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-secondary {
  background: transparent;
  color: var(--text);
  border: 1px solid var(--border);
  padding: 11px 18px;
  border-radius: 7px;
  font-family: 'Assistant', sans-serif;
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
}
.btn-secondary:hover { border-color: var(--muted); }
.guard-list { margin: 16px 0; display: flex; flex-direction: column; gap: 8px; }
.guard-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--panel-alt);
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 10px 12px;
  gap: 10px;
}
.guard-row .g-name { font-weight: 700; font-size: 14px; }
.guard-row .g-meta {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  color: var(--muted);
  display: flex;
  gap: 10px;
  margin-top: 2px;
  flex-wrap: wrap;
}
.icon-btn {
  background: none;
  border: none;
  color: var(--danger);
  cursor: pointer;
  padding: 6px;
  flex: none;
  display: flex;
}
.report-block {
  background: var(--panel-alt);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 18px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px;
  color: var(--amber);
  white-space: pre-wrap;
  line-height: 1.7;
  direction: ltr;
  text-align: left;
  overflow-x: auto;
}
.actions-row { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
.history-toggle {
  display: flex;
  align-items: center;
  gap: 8px;
  background: none;
  border: none;
  color: var(--muted);
  font-family: 'Assistant', sans-serif;
  font-size: 13px;
  cursor: pointer;
  margin: 22px 0 10px;
  padding: 0;
}
.history-toggle svg.chev { transition: transform 0.2s; }
.history-toggle.open svg.chev { transform: rotate(180deg); }
.history-item {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 14px;
  margin-bottom: 8px;
}
.history-item .h-top {
  display: flex;

  font-size: 13px;
  margin-bottom: 4px;
  gap: 10px;

.history-item .h-meta {

  font-size: 11px;
  color: var(--muted);
}
.toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--teal);
  color: #0d1f1d;
  padding: 8px 18px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 700;
  z-index: 50;
}
.history-toggle.manage-toggle { margin: 0; }
.manage-toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 0 0 14px; }
.lock-btn {
  background: none;
  border: 1px solid var(--border);
  color: var(--muted);
  border-radius: 6px;
  padding: 5px 10px;
  font-size: 12px;
  font-family: 'Assistant', sans-serif;
  cursor: pointer;
  flex: none;
  white-space: nowrap;
}
.lock-btn:hover { border-color: var(--muted); }
.pin-overlay {
  position: fixed;
  inset: 0;
  background: rgba(10, 12, 15, 0.72);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 16px;
}
.pin-box {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 22px;
  max-width: 340px;
  width: 100%;
}
.pin-title { font-family: 'Suez One', serif; font-size: 18px; margin-bottom: 8px; }
.pin-sub { font-size: 13px; color: var(--muted); margin-bottom: 14px; line-height: 1.5; }
.pin-box .input { margin-bottom: 10px; text-align: center; letter-spacing: 4px; font-size: 18px; }
.pin-box .actions-row { margin-top: 4px; }
.manage-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
  margin-bottom: 20px;
}
@media (min-width: 560px) {
  .manage-grid { grid-template-columns: repeat(2, 1fr); }
}
.manage-col { padding: 16px; }
.manage-col h3 {
  font-family: 'Suez One', serif;
  font-size: 15px;
  font-weight: normal;
  margin: 0 0 10px;
  color: var(--text);
}
.manage-add-row { display: flex; gap: 6px; margin-bottom: 10px; }
.manage-add-row .input { flex: 1; font-family: 'Assistant', sans-serif; }
.btn-icon-add {
  background: var(--amber);
  border: none;
  color: #1a1508;
  border-radius: 6px;
  padding: 0 12px;
  cursor: pointer;
  display: flex;
  align-items: center;
  flex: none;
}
.manage-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-height: 220px;
  overflow-y: auto;
}
.manage-col-guards { grid-column: 1 / -1; }
.guard-manage-item {
  background: var(--panel-alt);
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 8px 10px;
}
.guard-manage-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
  gap: 8px;
}
.guard-manage-top .g-name { font-weight: 700; font-size: 14px; }
.sector-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.sector-tag {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--muted);
  font-size: 11px;
  font-family: 'Assistant', sans-serif;
  padding: 4px 9px;
  border-radius: 20px;
  cursor: pointer;
}
.sector-tag.sector-tag-active {
  border-color: var(--amber);
  color: var(--amber);
  background: rgba(232,163,61,0.1);
}
.warn-note {
  font-size: 12px;
  color: var(--danger);
  margin-top: 8px;
}
</style>

/* ---------- helpers ---------- */
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function tagsMatchSector(itemSectors, currentSector) {
  return itemSectors.some(function (tag) {
    return currentSector === tag || currentSector.indexOf(tag + " - ") === 0;
  });
}
function formatDate(ts) {
  return new Date(ts).toLocaleDateString("he-IL", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
}
function formatTime(ts) {
  return new Date(ts).toLocaleTimeString("he-IL", { hour: "2-digit", minute: "2-digit" });
}
function buildReportText(record) {
  var lines = [];
  lines.push("📋 דוח שיבוץ משמרת");
  lines.push("🗓️ " + formatDate(record.timestamp) + " | " + formatTime(record.timestamp));
  lines.push('👤 קב"ט: ' + record.kabat);
  lines.push("📍 גזרה: " + record.sector);
  lines.push("🕐 משמרת: " + record.shift);
  lines.push("🎙️ מתדרך: " + record.briefer);

    lines.push((i + 1) + ". " + g.name + " | רכב: " + g.plate + " | קשר: " + g.radio + " | מצלמה: " + g.camera);
  });
  lines.push("");
  lines.push('סה"כ מאבטחים: ' + record.guards.length);
  return lines.join("\n");
}

function supaHeaders(extra) {
  var h = { "apikey": SUPA_KEY, "Authorization": "Bearer " + SUPA_KEY, "Content-Type": "application/json" };
  if (extra) for (var k in extra) h[k] = extra[k];

}
function supaGet(table, qs) {
  return fetch(SUPA_URL + "/rest/v1/" + table + (qs || "?select=*"), { headers: supaHeaders() }).then(function (r) {
    if (!r.ok) throw new Error("load failed: " + table);
    return r.json();
  });
}
function supaRpc(fnName, args) {
  return fetch(SUPA_URL + "/rest/v1/rpc/" + fnName, {
    method: "POST",
    headers: supaHeaders({ "Prefer": "return=representation" }),
    body: JSON.stringify(args)
  }).then(function (r) {
    return r.json().catch(function () { return null; }).then(function (body) {
      if (!r.ok) {
        var msg = (body && body.message) || (fnName + " failed");

    });
  });
}
function supaVerifyPin(pin) {
  return fetch(SUPA_URL + "/rest/v1/rpc/verify_edit_pin", {
    method: "POST",

    body: JSON.stringify({ p_pin: pin })

    if (!r.ok) throw new Error("verify failed");

}

function requirePin(action) {
  var pin = getStoredPin();
  if (pin) { action(pin); return; }
  pendingPinAction = action;
  ui.pinPromptOpen = true;
  ui.pinError = null;
  ui.pinChecking = false;
  render();
  setTimeout(function () {
    var el = document.getElementById("pin-input");
    if (el) el.focus();
  }, 30);
}
function submitPin() {
  var typed = getVal("pin-input");
  if (!typed) return;
  ui.pinChecking = true;
  render();
  supaVerifyPin(typed).then(function (ok) {
    ui.pinChecking = false;
    if (ok) {
      setStoredPin(typed);
      ui.pinPromptOpen = false;
      ui.pinError = null;
      render();
      var act = pendingPinAction;
      pendingPinAction = null;
      if (act) act(typed);
    } else {
      ui.pinError = "קוד שגוי — נסה שוב";
      render();
    }
  }).catch(function () {
    ui.pinChecking = false;
    ui.pinError = "שגיאת רשת — נסה שוב";
    render();
  });
}
function cancelPinPrompt() {
  ui.pinPromptOpen = false;
  ui.pinError = null;
  pendingPinAction = null;
  render();
}
function handleWriteError(err, fallbackMsg) {
  if (err && err.isPinError) {
    setStoredPin(null);
    showToast("קוד הגישה שגוי או פג תוקף — יש להזין קוד מחדש");
  } else {
    showToast(fallbackMsg);
  }
}
function dbShiftToRecord(row) {
  return {
    id: row.id, kabat: row.kabat, sector: row.sector, shift: row.shift, briefer: row.briefer,
    sectorCommander: row.sector_commander, guards: row.guards, timestamp: new Date(row.created_at).getTime()
  };
}
function isTypingInInput() {
  var el = document.activeElement;
  return !!(el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA"));
}
function loadAll() {
  ui.loadError = null;
  render();
  var jobs = ROSTER_CATS.map(function (cat) {
    return supaGet(cat).then(function (rows) { state.rosters[cat] = rows; });
  });
  jobs.push(supaGet("shifts", "?select=*&order=created_at.desc&limit=300").then(function (rows) {
    state.history = rows.map(dbShiftToRecord);
  }));
  Promise.all(jobs).then(function () {
    ui.loaded = true;
    render();
  }).catch(function () {
    ui.loadError = "טעינת הנתונים מהשרת נכשלה — בדוק חיבור לאינטרנט ונסה שוב.";
    render();
  });
}
function pollRefresh() {
  if (!ui.loaded) return;
  var jobs = ROSTER_CATS.filter(function (cat) { return pending[cat] === 0; }).map(function (cat) {
    return supaGet(cat).then(function (rows) { state.rosters[cat] = rows; }).catch(function () {});
  });
  if (pending.shifts === 0) {
    jobs.push(supaGet("shifts", "?select=*&order=created_at.desc&limit=300").then(function (rows) {
      state.history = rows.map(dbShiftToRecord);
    }).catch(function () {}));
  }
  Promise.all(jobs).then(function () {
    if (!isTypingInInput()) render();
  });
}

/* ---------- toast ---------- */
var toastTimer = null;
function showToast(msg) {
  ui.toast = msg;
  render();
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { ui.toast = null; render(); }, 2200);
}

/* ---------- clipboard ---------- */
function handleCopy(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () { showToast("הועתק ללוח!"); }).catch(function () { fallbackCopy(text); });
  } else {
    fallbackCopy(text);
  }
}
function fallbackCopy(text) {
  var ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand("copy");
    showToast("הועתק ללוח!");
  } catch (e) {}
  document.body.removeChild(ta);
}

/* ---------- roster mutation ---------- */
function findIdx(arr, key, val) {
  for (var i = 0; i < arr.length; i++) if (arr[i][key] === val) return i;
  return -1;
}
function rosterAdd(cat, keyVal, extraRow) {
  var keyField = KEY_FIELD[cat];
  keyVal = (keyVal || "").trim();
  if (!keyVal || findIdx(state.rosters[cat], keyField, keyVal) !== -1) return;
  requirePin(function (pin) {
    if (findIdx(state.rosters[cat], keyField, keyVal) !== -1) return;
    var item = { sectors: [] };
    item[keyField] = keyVal;
    state.rosters[cat].push(item);
    render();
    pending[cat]++;
    supaRpc("rpc_roster_add", { p_pin: pin, p_table: cat, p_value: keyVal, p_sectors: [] }).then(function (row) {
      var idx = state.rosters[cat].indexOf(item);
      if (idx !== -1 && row) state.rosters[cat][idx] = row;
      render();
    }).catch(function (err) {
      state.rosters[cat] = state.rosters[cat].filter(function (x) { return x !== item; });
      handleWriteError(err, "שגיאה בהוספה — בדוק חיבור לאינטרנט ונסה שוב");
      render();
    }).then(function () { pending[cat]--; }, function () { pending[cat]--; });
  });
}
function rosterRemove(cat, keyVal) {
  var keyField = KEY_FIELD[cat];
  if (findIdx(state.rosters[cat], keyField, keyVal) === -1) return;
  requirePin(function (pin) {
    var idx = findIdx(state.rosters[cat], keyField, keyVal);
    if (idx === -1) return;
    var removed = state.rosters[cat][idx];
    state.rosters[cat].splice(idx, 1);
    render();
    pending[cat]++;
    supaRpc("rpc_roster_remove", { p_pin: pin, p_table: cat, p_value: keyVal }).catch(function (err) {
      state.rosters[cat].splice(idx, 0, removed);
      handleWriteError(err, "שגיאה במחיקה — נסה שוב");
      render();
    }).then(function () { pending[cat]--; }, function () { pending[cat]--; });
  });
}
function rosterToggleSector(cat, keyVal, sec) {
  var keyField = KEY_FIELD[cat];
  requirePin(function (pin) {
    var item = state.rosters[cat].filter(function (x) { return x[keyField] === keyVal; })[0];
    if (!item) return;
    var oldSectors = item.sectors;
    var has = oldSectors.indexOf(sec) !== -1;
    var newSectors = has ? oldSectors.filter(function (s) { return s !== sec; }) : oldSectors.concat([sec]);
    item.sectors = newSectors;
    render();
    pending[cat]++;
    supaRpc("rpc_roster_toggle_sector", { p_pin: pin, p_table: cat, p_value: keyVal, p_sector: sec }).then(function (row) {
      if (row && row.sectors) item.sectors = row.sectors;
      render();
    }).catch(function (err) {
      item.sectors = oldSectors;
      handleWriteError(err, "שגיאה בעדכון גזרות — נסה שוב");
      render();
    }).then(function () { pending[cat]--; }, function () { pending[cat]--; });
  });
}
function addGuardToRoster(name) { rosterAdd("guards", name); }
function removeGuardFromRoster(name) { rosterRemove("guards", name); }
function toggleGuardSector(name, sec) { rosterToggleSector("guards", name, sec); }
function addVehicleToRoster(plate) {
  plate = (plate || "").replace(/-/g, "").trim();
  rosterAdd("vehicles", plate);
}
function removeVehicleFromRoster(plate) { rosterRemove("vehicles", plate); }
function toggleVehicleSector(plate, sec) { rosterToggleSector("vehicles", plate, sec); }
function addTaggedItem(cat, value) { rosterAdd(cat, value); }
function removeTaggedItem(cat, value) { rosterRemove(cat, value); }
function toggleTaggedItemSector(cat, value, sec) { rosterToggleSector(cat, value, sec); }

/* ---------- assignment flow ---------- */
function resetForNewAssignment() {
  ui.step = 2;
  ui.sector = null;
  ui.pendingMain = null;
  ui.shift = null;
  ui.briefer = "";
  ui.sectorCommander = "";
  ui.guards = [];
  ui.form = { name: "", plate: "", radio: "", camera: "" };
  ui.record = null;
  render();
}
function addGuardToAssignment() {
  var f = ui.form;
  if (!f.name.trim() || !f.plate.trim() || !f.radio.trim() || !f.camera.trim()) return;
  ui.guards.push({ id: uid(), name: f.name, plate: f.plate, radio: f.radio, camera: f.camera });
  showToast(f.name + " נוסף לשיבוץ בהצלחה");
  ui.form = { name: "", plate: "", radio: "", camera: "" };
  render();
}
function removeGuardFromAssignment(id) {
  ui.guards = ui.guards.filter(function (g) { return g.id !== id; });
  render();
}
function finishAssignment() {
  if (ui.guards.length === 0) return;
  requirePin(function (pin) {
    var rec = {
      kabat: ui.selectedKabat, sector: ui.sector, shift: ui.shift, briefer: ui.briefer,
      sectorCommander: ui.sectorCommander, guards: ui.guards, timestamp: Date.now()
    };
    ui.record = rec;
    ui.step = 6;
    state.history = [rec].concat(state.history);
    render();
    pending.shifts++;
    supaRpc("rpc_finish_shift", {
      p_pin: pin, p_kabat: rec.kabat, p_sector: rec.sector, p_shift: rec.shift,
      p_briefer: rec.briefer, p_sector_commander: rec.sectorCommander, p_guards: rec.guards
    }).then(function (row) {
      if (row) {
        rec.id = row.id;
        rec.timestamp = new Date(row.created_at).getTime();
        render();
      }
    }).catch(function (err) {
      if (err && err.isPinError) {
        setStoredPin(null);
        ui.persistWarning = "קוד הגישה שגוי או פג תוקף — הדוח מוצג כאן אך לא נשמר במאגר המשותף. יש לנעול ולפתוח מחדש עם הקוד הנכון.";
      } else {
        ui.persistWarning = "שמירת הדוח בשרת נכשלה — הדוח מוצג כאן אך לא נשמר במאגר המשותף.";
      }
      render();
    }).then(function () { pending.shifts--; }, function () { pending.shifts--; });
  });
}

  var usedCameras = ui.guards.map(function (g) { return g.camera; });
  var sectorGuards = state.rosters.guards.filter(function (g) { return tagsMatchSector(g.sectors, ui.sector); });
  var availGuards = sectorGuards.filter(function (g) { return usedNames.indexOf(g.name) === -1; });
  var sectorVehicles = state.rosters.vehicles.filter(function (v) { return tagsMatchSector(v.sectors, ui.sector); });
  var availVehicles = sectorVehicles.filter(function (v) { return usedPlates.indexOf(v.plate) === -1; });
  var sectorRadios = state.rosters.radios.filter(function (r) { return tagsMatchSector(r.sectors, ui.sector); });
  var availRadios = sectorRadios.filter(function (r) { return usedRadios.indexOf(r.value) === -1; });
  var sectorCameras = state.rosters.cameras.filter(function (c) { return tagsMatchSector(c.sectors, ui.sector); });
  var availCameras = sectorCameras.filter(function (c) { return usedCameras.indexOf(c.value) === -1; });
  var formComplete = ui.form.name.trim() && ui.form.plate.trim() && ui.form.radio.trim() && ui.form.camera.trim();

  function selectField(label, iconHtml, bind, options, current, sectorList, availList, unitLabel) {
    var opts = '<option value="">בחר...</option>' + options.map(function (o) {
      var val = typeof o === "string" ? o : (o.name || o.plate || o.value);
      return '<option value="' + esc(val) + '"' + (current === val ? " selected" : "") + ">" + esc(val) + "</option>";
    }).join("");
    var hint = "";
    if (sectorList.length === 0) hint = '<div class="field-hint">אין ' + unitLabel + ' המשויכים לגזרה "' + esc(ui.sector) + '" — הוסף שיוך ב"ניהול רשימות" למעלה</div>';
    else if (availList.length === 0) hint = '<div class="field-hint">כל ה' + unitLabel + ' המשויכים לגזרה זו כבר בשימוש במשמרת הנוכחית</div>';
    return '<div class="field-row"><div class="field-label">' + iconHtml + " " + label + '</div><select class="input' + (bind === "name" ? " name-input" : "") + (!current ? " input-empty" : "") + '" data-bind="form.' + bind + '">' + opts + "</select>" + hint + "</div>";
  }

  var nameOpts = '<option value="">בחר מאבטח...</option>' + availGuards.map(function (g) {
    return '<option value="' + esc(g.name) + '"' + (ui.form.name === g.name ? " selected" : "") + ">" + esc(g.name) + "</option>";
  }).join("");
  var nameHint = sectorGuards.length === 0 ? '<div class="field-hint">אין מאבטחים המשויכים לגזרה "' + esc(ui.sector) + '" — הוסף שיוך ב"ניהול רשימות" למעלה</div>' :
    (availGuards.length === 0 ? '<div class="field-hint">כל המאבטחים המשויכים לגזרה זו כבר שובצו במשמרת הנוכחית</div>' : "");

  var guardListHtml = ui.guards.length > 0 ? '<div class="guard-list">' + ui.guards.map(function (g) {
    return '<div class="guard-row"><div><div class="g-name">' + esc(g.name) + '</div><div class="g-meta"><span>רכב ' + esc(g.plate) + '</span><span>קשר ' + esc(g.radio) + '</span><span>מצלמה ' + esc(g.camera) + '</span></div></div>' +
      '<button class="icon-btn" data-act="remove-assign-guard" data-id="' + esc(g.id) + '">' + ICONS.trash + "</button></div>";
  }).join("") + "</div>" : "";

  return '<div class="panel"><h2>שיבוץ מאבטחים — ' + esc(ui.sector) + " · " + esc(ui.shift) + '</h2>' +
    '<div class="field-row"><div class="field-label">' + ICONS.users + ' שם המאבטח *</div><select class="input name-input' + (!ui.form.name ? " input-empty" : "") + '" data-bind="form.name">' + nameOpts + "</select>" + nameHint + "</div>" +
    selectField("מספר רישוי רכב *", ICONS.car, "plate", availVehicles.map(function (v) { return v.plate; }), ui.form.plate, sectorVehicles, availVehicles, "רכבים") +
    selectField("מספר מכשיר קשר *", ICONS.radio, "radio", availRadios.map(function (r) { return r.value; }), ui.form.radio, sectorRadios, availRadios, "מכשירי קשר") +
    selectField("מספר מצלמה *", ICONS.camera, "camera", availCameras.map(function (c) { return c.value; }), ui.form.camera, sectorCameras, availCameras, "מצלמות") +
    '<button class="btn-primary" data-act="add-assign-guard"' + (!formComplete ? " disabled" : "") + '><span style="display:flex;align-items:center;gap:6px">' + ICONS.plus + " הוסף מאבטח לשיבוץ</span></button>" +
    (!formComplete ? '<div class="field-hint">יש למלא את כל השדות (*) לפני ההוספה</div>' : "") +
    guardListHtml +
    '<div class="actions-row"><button class="btn-secondary" data-act="back-step4">חזרה</button>' +
    '<button class="btn-primary" data-act="finish-assignment"' + (ui.guards.length === 0 ? " disabled" : "") + '>סיים שיבוץ והפק דוח (' + ui.guards.length + ")</button></div></div>";
}
function renderStep6() {
  if (!ui.record) return "";
  var text = buildReportText(ui.record);
  return '<div class="panel"><h2>' + ICONS.checkCircle.replace("width=\"15\" height=\"15\"", "width=\"18\" height=\"18\"") + "דוח שיבוץ הופק</h2>" +
    '<div class="report-block">' + esc(text) + "</div>" +
    (ui.persistWarning ? '<div class="warn-note">הדוח נוצר אך לא נשמר בהיסטוריה המשותפת (' + esc(ui.persistWarning) + ")</div>" : "") +
    '<div class="actions-row"><button class="btn-primary" data-act="copy-report"><span style="display:flex;align-items:center;gap:6px">' + ICONS.copy + " העתק להודעת וואטסאפ</span></button>" +
    '<button class="btn-secondary" data-act="new-assignment">שיבוץ חדש</button></div></div>';
}
function renderStepPanel() {
  if (ui.step === 1) return renderStep1();
  if (ui.step === 2) return renderStep2();
  if (ui.step === 3) return renderStep3();
  if (ui.step === 4) return renderStep4();
  if (ui.step === 5) return renderStep5();
  if (ui.step === 6) return renderStep6();
  return "";
}
function renderHistoryToggle() {
  return '<button class="history-toggle' + (ui.historyOpen ? " open" : "") + '" data-act="toggle-history">' +
    ICONS.history + "משמרות קודמות (" + state.history.length + ")" + ICONS.chevronDown + "</button>";
}
function renderHistoryPanel() {
  if (state.history.length === 0) return '<div class="h-meta">אין עדיין משמרות שמורות.</div>';
  var items = state.history.slice(0, 15).map(function (h) {
    var expanded = ui.expandedHistoryTs === h.timestamp;
    var body = expanded ? '<div class="report-block" style="margin-top:10px">' + esc(buildReportText(h)) + "</div>" +
      '<div class="actions-row" style="margin-top:10px"><button class="btn-secondary" data-act="copy-history-item" data-ts="' + h.timestamp + '"><span style="display:flex;align-items:center;gap:6px">' + ICONS.copy + " העתק דוח זה</span></button></div>" : "";
    return '<div class="history-item"><div class="h-top" style="cursor:pointer" data-act="toggle-history-item" data-ts="' + h.timestamp + '"><span>' + esc(h.kabat) + " · " + esc(h.sector) + " · " + esc(h.shift) + "</span><span>" + h.guards.length + ' מאבטחים</span></div>' +
      '<div class="h-meta">' + esc(formatDate(h.timestamp)) + " · " + esc(formatTime(h.timestamp)) + "</div>" + body + "</div>";
  }).join("");
  return "<div>" + items + "</div>";
}
function renderApp() {
  if (!ui.loaded) {
    return '<div dir="rtl" lang="he" class="wrap"><div class="shell">' +
      renderHeader() +
      '<div class="panel" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;min-height:220px;text-align:center">' +
      (ui.loadError
        ? ('<div style="color:var(--danger)">' + esc(ui.loadError) + '</div><button class="btn-primary" data-act="retry-load">נסה שוב</button>')
        : '<div style="color:var(--muted)">טוען נתונים מהשרת…</div>') +
      "</div></div></div>";
  }
  return '<div dir="rtl" lang="he" class="wrap"><div class="shell">' +
    renderHeader() + renderManageToggle() +
    (ui.manageOpen ? renderManagePanel() : "") +
    renderConsoleStrip() + renderStepPanel() +
    renderHistoryToggle() + (ui.historyOpen ? renderHistoryPanel() : "") +
    "</div>" + (ui.toast ? '<div class="toast">' + esc(ui.toast) + "</div>" : "") +
    (ui.pinPromptOpen ? renderPinOverlay() : "") + "</div>";
}

var root = document.getElementById("root");
function render() {
  root.innerHTML = renderApp();
}

/* ---------- events ---------- */
function getVal(id) {
  var el = document.getElementById(id);
  return el ? el.value : "";
}
function clearVal(id) {
  var el = document.getElementById(id);
  if (el) el.value = "";
}
root.addEventListener("click", function (e) {
  var el = e.target.closest("[data-act]");
  if (!el) return;
  var act = el.getAttribute("data-act");
  switch (act) {
    case "retry-load": loadAll(); break;
    case "toggle-manage": ui.manageOpen = !ui.manageOpen; render(); break;
    case "lock-again": setStoredPin(null); showToast("המכשיר ננעל — יידרש קוד גישה בפעם הבאה"); render(); break;
    case "submit-pin": submitPin(); break;
    case "cancel-pin": cancelPinPrompt(); break;
    case "toggle-history": ui.historyOpen = !ui.historyOpen; render(); break;
    case "toggle-history-item": {
      var ts = Number(el.getAttribute("data-ts"));
      ui.expandedHistoryTs = ui.expandedHistoryTs === ts ? null : ts;
      render();
      break;
    }
    case "copy-history-item": {
      var ts2 = Number(el.getAttribute("data-ts"));
      var rec = state.history.filter(function (h) { return h.timestamp === ts2; })[0];
      if (rec) handleCopy(buildReportText(rec));
      break;
    }
    case "jump-to": {
      var idx = Number(el.getAttribute("data-idx"));
      if (idx + 1 < ui.step) { ui.step = idx + 1; render(); }
      break;
    }
    case "pick-kabat": {
      var kv = el.getAttribute("data-value");
      ui.selectedKabat = kv; ui.sector = null; ui.pendingMain = null; ui.shift = null;
      ui.briefer = ""; ui.sectorCommander = ""; ui.guards = []; ui.form = { name: "", plate: "", radio: "", camera: "" };
      ui.step = 2; render();
      break;
    }
    case "change-kabat": ui.step = 1; render(); break;
    case "pick-main-sector": ui.pendingMain = el.getAttribute("data-value"); render(); break;
    case "clear-pending-main": ui.pendingMain = null; render(); break;
    case "pick-leaf-sector": {
      ui.sector = el.getAttribute("data-value"); ui.pendingMain = null; ui.guards = [];
      ui.form = { name: "", plate: "", radio: "", camera: "" }; ui.briefer = ""; ui.sectorCommander = "";
      ui.step = 3; render();
      break;
    }
    case "pick-sub-sector": {
      ui.sector = ui.pendingMain + " - " + el.getAttribute("data-value"); ui.pendingMain = null; ui.guards = [];
      ui.form = { name: "", plate: "", radio: "", camera: "" }; ui.briefer = ""; ui.sectorCommander = "";
      ui.step = 3; render();
      break;
    }
    case "back-step2": ui.step = 2; render(); break;
    case "pick-shift": ui.shift = el.getAttribute("data-value"); ui.step = 4; render(); break;
    case "back-step3": ui.step = 3; render(); break;
    case "continue-step5": if (ui.briefer && ui.sectorCommander) { ui.step = 5; render(); } break;
    case "back-step4": ui.step = 4; render(); break;
    case "add-assign-guard": addGuardToAssignment(); break;
    case "remove-assign-guard": removeGuardFromAssignment(el.getAttribute("data-id")); render(); break;
    case "finish-assignment": finishAssignment(); break;
    case "copy-report": if (ui.record) handleCopy(buildReportText(ui.record)); break;
    case "new-assignment": resetForNewAssignment(); break;
    case "add-guard-roster": addGuardToRoster(getVal("new-guard-name")); clearVal("new-guard-name"); break;
    case "remove-guard-roster": removeGuardFromRoster(el.getAttribute("data-name")); break;
    case "add-vehicle-roster": addVehicleToRoster(getVal("new-vehicle-plate")); clearVal("new-vehicle-plate"); break;
    case "remove-vehicle-roster": removeVehicleFromRoster(el.getAttribute("data-plate")); break;
    case "add-tagged": { var cat = el.getAttribute("data-cat"); addTaggedItem(cat, getVal("new-" + cat)); clearVal("new-" + cat); break; }
    case "remove-tagged": removeTaggedItem(el.getAttribute("data-cat"), el.getAttribute("data-value")); break;
    case "toggle-sector": {
      var cat2 = el.getAttribute("data-cat"), val2 = el.getAttribute("data-value"), sec2 = el.getAttribute("data-sector");
      if (cat2 === "guards") toggleGuardSector(val2, sec2);
      else if (cat2 === "vehicles") toggleVehicleSector(val2, sec2);
      else toggleTaggedItemSector(cat2, val2, sec2);
      break;
    }
  }
});
root.addEventListener("keydown", function (e) {
  if (e.key !== "Enter") return;
  var el = e.target.closest("[data-enter-act]");
  if (!el) return;
  var act = el.getAttribute("data-enter-act");
  if (act === "add-guard-roster") { addGuardToRoster(getVal("new-guard-name")); clearVal("new-guard-name"); }
  else if (act === "add-vehicle-roster") { addVehicleToRoster(getVal("new-vehicle-plate")); clearVal("new-vehicle-plate"); }
  else if (act === "add-tagged") { var cat = el.getAttribute("data-cat"); addTaggedItem(cat, getVal("new-" + cat)); clearVal("new-" + cat); }
  else if (act === "submit-pin") { submitPin(); }
});
root.addEventListener("change", function (e) {
  var el = e.target.closest("[data-bind]");
  if (!el) return;
  var bind = el.getAttribute("data-bind");
  if (bind === "briefer") ui.briefer = el.value;
  else if (bind === "sectorCommander") ui.sectorCommander = el.value;
  else if (bind.indexOf("form.") === 0) ui.form[bind.slice(5)] = el.value;
  render();
});
loadAll();
setInterval(pollRefresh, 20000);
document.addEventListener("visibilitychange", function () { if (!document.hidden) pollRefresh(); });
})();
</script>
</body>
</html>
