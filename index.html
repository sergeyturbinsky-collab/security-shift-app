<div id="root"></div>
<style id="app-style">
html, body { margin: 0; padding: 0; background: #eaf3fb; }
.wrap {
  --bg: #eaf3fb;
  --panel: #ffffff;
  --panel-alt: #f2f8fd;
  --border: #cfe3f2;
  --text: #143552;
  --muted: #5b7f99;
  --amber: #1976c9;
  --amber-dim: #dbe9f7;
  --teal: #17a6b0;
  --danger: #d1495b;
  font-family: 'Assistant', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 24px 16px 40px;
  box-sizing: border-box;
}
.wrap * { box-sizing: border-box; }
.shell { max-width: 720px; margin: 0 auto; }
.eyebrow {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12px;
  letter-spacing: 0.12em;
  color: var(--amber);
  text-transform: uppercase;
  margin-bottom: 6px;
}
.title {
  font-family: 'Suez One', serif;
  font-size: 30px;
  margin: 0 0 6px;
  color: var(--text);
  text-wrap: balance;
}
.date-display {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 18px;
}
.conn-note {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: var(--muted);
  margin: -10px 0 16px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.conn-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--teal); flex: none; }
.conn-note.conn-warn .conn-dot { background: var(--danger); }
.conn-note.conn-warn { color: var(--danger); }
.console-strip {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
}
.segment {
  flex: 1;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 10px 8px;
  text-align: center;
  cursor: default;
  transition: border-color 0.2s, background 0.2s;
}
.segment.active {
  border-color: var(--amber);
  background: linear-gradient(180deg, rgba(25,118,201,0.14), rgba(25,118,201,0.03));
}
.segment.done { cursor: pointer; }
.segment .dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--border);
  margin: 0 auto 6px;
}
.segment.active .dot, .segment.done .dot { background: var(--amber); }
.segment .seg-label {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: var(--muted);
}
.segment.active .seg-label, .segment.done .seg-label { color: var(--text); }
.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 22px;
}
.panel h2 {
  font-family: 'Suez One', serif;
  font-size: 20px;
  margin: 0 0 16px;
  font-weight: normal;
  text-wrap: balance;
}
.grid-6 {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}
@media (min-width: 480px) {
  .grid-6 { grid-template-columns: repeat(3, 1fr); }
}
.choice-btn {
  background: var(--panel-alt);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 14px 10px;
  border-radius: 8px;
  font-family: 'Assistant', sans-serif;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: border-color 0.15s, transform 0.1s;
}
.choice-btn:hover { border-color: var(--amber); }
.choice-btn:active { transform: scale(0.98); }
.choice-btn:focus-visible, .btn-primary:focus-visible, .btn-secondary:focus-visible,
.icon-btn:focus-visible, .sector-tag:focus-visible, .history-toggle:focus-visible,
.btn-icon-add:focus-visible, .input:focus-visible {
  outline: 2px solid var(--teal);
  outline-offset: 2px;
}
.choice-btn.choice-btn-selected {
  border-color: var(--amber);
  background: linear-gradient(180deg, rgba(25,118,201,0.14), rgba(25,118,201,0.03));
}
.field-row { margin-bottom: 12px; }
.field-label {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 6px;
}
.field-label svg { width: 15px; height: 15px; }
.input {
  width: 100%;
  background: var(--panel-alt);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 10px 12px;
  border-radius: 7px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 14px;
}
.input:focus { outline: none; border-color: var(--amber); }
.input.name-input { font-family: 'Assistant', sans-serif; }
.input.input-empty { border-color: rgba(217,86,74,0.45); }
.field-hint {

  color: var(--danger);

}
.btn-primary {
  background: var(--amber);

  padding: 11px 20px;
  border-radius: 7px;
  font-family: 'Assistant', sans-serif;
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
}
.btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-secondary {
  background: transparent;
  color: var(--text);
  border: 1px solid var(--border);
  padding: 11px 18px;
  border-radius: 7px;
  font-family: 'Assistant', sans-serif;
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
}
.btn-secondary:hover { border-color: var(--muted); }
.guard-list { margin: 16px 0; display: flex; flex-direction: column; gap: 8px; }
.guard-row {

  padding: 10px 12px;
  gap: 10px;

.guard-row .g-name { font-weight: 700; font-size: 14px; }
.guard-row .g-meta {

  font-size: 12px;
  color: var(--muted);
  display: flex;
  gap: 10px;
  margin-top: 2px;
  flex-wrap: wrap;
}
.icon-btn {

  border: none;
  color: var(--danger);

  padding: 6px;

}
.report-block {

  border-radius: 8px;
  padding: 18px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px;
  color: var(--amber);
  white-space: pre-wrap;
  line-height: 1.7;
  direction: ltr;
  text-align: left;
  overflow-x: auto;
}
.actions-row { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
.history-toggle {
  display: flex;
  align-items: center;
  gap: 8px;
  background: none;
  border: none;
  color: var(--muted);
  font-family: 'Assistant', sans-serif;
  font-size: 13px;
  cursor: pointer;
  margin: 22px 0 10px;
  padding: 0;
}
.history-toggle svg.chev { transition: transform 0.2s; }
.history-toggle.open svg.chev { transform: rotate(180deg); }
.history-item {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 14px;
  margin-bottom: 8px;
}
.history-item .h-top {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  margin-bottom: 4px;
  gap: 10px;
}
.history-item .h-meta {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px;
  color: var(--muted);
}
.toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--teal);
  color: #ffffff;
  padding: 8px 18px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 700;
  z-index: 50;
}
.history-toggle.manage-toggle { margin: 0; }
.manage-toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 0 0 14px; }
.lock-btn {
  background: none;
  border: 1px solid var(--border);
  color: var(--muted);
  border-radius: 6px;
  padding: 5px 10px;
  font-size: 12px;
  font-family: 'Assistant', sans-serif;
  cursor: pointer;
  flex: none;
  white-space: nowrap;
}
.lock-btn:hover { border-color: var(--muted); }
.pin-overlay {
  position: fixed;
  inset: 0;
  background: rgba(8, 24, 40, 0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 16px;
}
.pin-box {

  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 22px;

.pin-title { font-family: 'Suez One', serif; font-size: 18px; margin-bottom: 8px; }
.pin-sub { font-size: 13px; color: var(--muted); margin-bottom: 14px; line-height: 1.5; }
.pin-box .input { margin-bottom: 10px; text-align: center; letter-spacing: 4px; font-size: 18px; }
.pin-box .actions-row { margin-top: 4px; }
.manage-grid {

  grid-template-columns: 1fr;
  gap: 12px;

}
@media (min-width: 560px) {
  .manage-grid { grid-template-columns: repeat(2, 1fr); }
}
.manage-col { padding: 16px; }
.manage-col h3 {
  font-family: 'Suez One', serif;
  font-size: 15px;
  font-weight: normal;
  margin: 0 0 10px;
  color: var(--text);
}
.manage-add-row { display: flex; gap: 6px; margin-bottom: 10px; }
.manage-add-row .input { flex: 1; font-family: 'Assistant', sans-serif; }
.btn-icon-add {
  background: var(--amber);
  border: none;
  color: #ffffff;
  border-radius: 6px;
  padding: 0 12px;
  cursor: pointer;
  display: flex;
  align-items: center;
  flex: none;
}
.manage-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-height: 220px;
  overflow-y: auto;
}
.manage-col-guards { grid-column: 1 / -1; }
.guard-manage-item {
  background: var(--panel-alt);
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 8px 10px;
}
.guard-manage-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
  gap: 8px;
}
.guard-manage-top .g-name { font-weight: 700; font-size: 14px; }
.sector-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.sector-tag {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--muted);
  font-size: 11px;
  font-family: 'Assistant', sans-serif;
  padding: 4px 9px;
  border-radius: 20px;
  cursor: pointer;
}
.sector-tag.sector-tag-active {
  border-color: var(--amber);
  color: var(--amber);
  background: rgba(25,118,201,0.1);
}
.warn-note {
  font-size: 12px;
  color: var(--danger);
  margin-top: 8px;
}

.header-banner {
  margin: -24px -16px 20px;
  padding: 16px 14px;
  background: linear-gradient(135deg, #0f5fa8, #2f8fd6 55%, #57b6ea);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
}
.logo-chip {
  padding: 4px 6px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.logo-chip img { height: 44px; width: auto; display: block; filter: drop-shadow(0 1px 3px rgba(6,25,45,0.35)); }
@media (min-width: 480px) {
  .logo-chip img { height: 54px; }
}
.date-display { display: inline-block; }
.btn-link {
  background: none;
  border: none;
  color: var(--amber);
  font-family: 'Assistant', sans-serif;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  padding: 0;
  margin: 0 0 18px;
  display: inline-block;
  text-decoration: underline;
}
.date-edit-row { display: flex; gap: 8px; align-items: center; margin: 0 0 18px; flex-wrap: wrap; }
.date-edit-row .input.date-input { max-width: 220px; }
.panel-inset {
  background: var(--panel-alt);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px;
  margin-top: 14px;
}
.btn-whatsapp {
  background: #25d366;
  color: #ffffff;
  border: none;
  padding: 11px 20px;
  border-radius: 7px;
  font-family: 'Assistant', sans-serif;
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.btn-whatsapp:hover { background: #20bd5a; }
.btn-save-send { display: block; width: 100%; margin: 10px 0 0; text-align: center; }
</style>

/* ---------- helpers ---------- */
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

}
function formatDate(ts) {
  return new Date(ts).toLocaleDateString("he-IL", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
}
function formatTime(ts) {
  return new Date(ts).toLocaleTimeString("he-IL", { hour: "2-digit", minute: "2-digit" });
}
function todayYMD() {
  var d = new Date();
  var m = String(d.getMonth() + 1).padStart(2, "0");
  var day = String(d.getDate()).padStart(2, "0");
  return d.getFullYear() + "-" + m + "-" + day;
}
function formatDateFromYMD(ymd) {
  if (!ymd) return "";
  var parts = ymd.split("-");
  var d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
  return d.toLocaleDateString("he-IL", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
}
function buildHalfHourOptions() {
  var out = [];
  for (var h = 0; h < 24; h++) {
    for (var m = 0; m < 60; m += 30) {
      out.push(String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0"));
    }
  }
  return out;
}
function buildReportText(record) {
  var lines = [];
  lines.push("📋 דוח שיבוץ משמרת");
  lines.push("🗓️ " + (record.shiftDate ? formatDateFromYMD(record.shiftDate) : formatDate(record.timestamp)) + " | " + formatTime(record.timestamp));
  lines.push('👤 קב"ט: ' + record.kabat);
  lines.push("📍 גזרה: " + record.sector);
  lines.push("🕐 משמרת: " + record.shift);
  lines.push("🎙️ מתדרך: " + record.briefer);
  lines.push('🎖️ אחמ"ש גזרתי: ' + record.sectorCommander);
  lines.push("");
  lines.push("👮 מאבטחים משובצים:");
  record.guards.forEach(function (g, i) {
    lines.push((i + 1) + ". " + g.name + " | רכב: " + g.plate + " | קשר: " + g.radio + " | מצלמה: " + g.camera);
  });
  lines.push("");
  lines.push('סה"כ מאבטחים: ' + record.guards.length);
  return lines.join("\n");
}
function uid() {
  return Date.now() + "-" + Math.random().toString(36).slice(2, 8);

function supaHeaders(extra) {
  var h = { "apikey": SUPA_KEY, "Authorization": "Bearer " + SUPA_KEY, "Content-Type": "application/json" };
  if (extra) for (var k in extra) h[k] = extra[k];
  return h;
}
function supaGet(table, qs) {
  return fetch(SUPA_URL + "/rest/v1/" + table + (qs || "?select=*"), { headers: supaHeaders() }).then(function (r) {
    if (!r.ok) throw new Error("load failed: " + table);
    return r.json();
  });
}
function supaRpc(fnName, args) {
  return fetch(SUPA_URL + "/rest/v1/rpc/" + fnName, {
    method: "POST",
    headers: supaHeaders({ "Prefer": "return=representation" }),
    body: JSON.stringify(args)
  }).then(function (r) {
    return r.json().catch(function () { return null; }).then(function (body) {
      if (!r.ok) {
        var msg = (body && body.message) || (fnName + " failed");
        var err = new Error(msg);
        err.isPinError = msg === "invalid pin";
        throw err;
      }
      return body;
    });
  });
}
function supaVerifyPin(pin) {
  return fetch(SUPA_URL + "/rest/v1/rpc/verify_edit_pin", {
    method: "POST",
    headers: supaHeaders(),
    body: JSON.stringify({ p_pin: pin })
  }).then(function (r) {
    if (!r.ok) throw new Error("verify failed");
    return r.json();
  });
}

/* ---------- edit-pin lock ---------- */
var EDIT_PIN_STORAGE_KEY = "spb_edit_pin";
var pendingPinAction = null;
function getStoredPin() {
  try { return localStorage.getItem(EDIT_PIN_STORAGE_KEY) || null; } catch (e) { return null; }
}
function setStoredPin(pin) {
  try {
    if (pin) localStorage.setItem(EDIT_PIN_STORAGE_KEY, pin);
    else localStorage.removeItem(EDIT_PIN_STORAGE_KEY);
  } catch (e) {}
}
function requirePin(action) {
  var pin = getStoredPin();
  if (pin) { action(pin); return; }
  pendingPinAction = action;
  ui.pinPromptOpen = true;
  ui.pinError = null;
  ui.pinChecking = false;
  render();
  setTimeout(function () {
    var el = document.getElementById("pin-input");
    if (el) el.focus();
  }, 30);
}
function submitPin() {
  var typed = getVal("pin-input");
  if (!typed) return;
  ui.pinChecking = true;
  render();
  supaVerifyPin(typed).then(function (ok) {
    ui.pinChecking = false;
    if (ok) {
      setStoredPin(typed);
      ui.pinPromptOpen = false;
      ui.pinError = null;
      render();
      var act = pendingPinAction;
      pendingPinAction = null;
      if (act) act(typed);
    } else {
      ui.pinError = "קוד שגוי — נסה שוב";
      render();
    }
  }).catch(function () {
    ui.pinChecking = false;
    ui.pinError = "שגיאת רשת — נסה שוב";
    render();
  });
}
function cancelPinPrompt() {

}
function handleWriteError(err, fallbackMsg) {

    setStoredPin(null);
    showToast("קוד הגישה שגוי או פג תוקף — יש להזין קוד מחדש");

    showToast(fallbackMsg);
  }
}
function dbShiftToRecord(row) {
  return {
    id: row.id, kabat: row.kabat, sector: row.sector, shift: row.shift, briefer: row.briefer,
    sectorCommander: row.sector_commander, guards: row.guards, timestamp: new Date(row.created_at).getTime()
  };
}
function isTypingInInput() {
  var el = document.activeElement;
  return !!(el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA"));
}
function loadAll() {
  ui.loadError = null;
  render();
  var jobs = ROSTER_CATS.map(function (cat) {
    return supaGet(cat).then(function (rows) { state.rosters[cat] = rows; });
  });
  jobs.push(supaGet("shifts", "?select=*&order=created_at.desc&limit=300").then(function (rows) {
    state.history = rows.map(dbShiftToRecord);
  }));
  Promise.all(jobs).then(function () {
    ui.loaded = true;
    render();
  }).catch(function () {
    ui.loadError = "טעינת הנתונים מהשרת נכשלה — בדוק חיבור לאינטרנט ונסה שוב.";
    render();
  });
}
function pollRefresh() {
  if (!ui.loaded) return;
  var jobs = ROSTER_CATS.filter(function (cat) { return pending[cat] === 0; }).map(function (cat) {
    return supaGet(cat).then(function (rows) { state.rosters[cat] = rows; }).catch(function () {});
  });
  if (pending.shifts === 0) {
    jobs.push(supaGet("shifts", "?select=*&order=created_at.desc&limit=300").then(function (rows) {
      state.history = rows.map(dbShiftToRecord);
    }).catch(function () {}));
  }
  Promise.all(jobs).then(function () {
    if (!isTypingInInput()) render();
  });
}

/* ---------- clipboard ---------- */
function handleCopy(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () { showToast("הועתק ללוח!"); }).catch(function () { fallbackCopy(text); });
  } else {
    fallbackCopy(text);
  }
}
function fallbackCopy(text) {
  var ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand("copy");
    showToast("הועתק ללוח!");
  } catch (e) {}
  document.body.removeChild(ta);
}

/* ---------- roster mutation ---------- */
function findIdx(arr, key, val) {
  for (var i = 0; i < arr.length; i++) if (arr[i][key] === val) return i;
  return -1;
}
function rosterAdd(cat, keyVal, extraRow) {
  var keyField = KEY_FIELD[cat];
  keyVal = (keyVal || "").trim();
  if (!keyVal || findIdx(state.rosters[cat], keyField, keyVal) !== -1) return;
  requirePin(function (pin) {
    if (findIdx(state.rosters[cat], keyField, keyVal) !== -1) return;
    var item = { sectors: [] };
    item[keyField] = keyVal;
    state.rosters[cat].push(item);
    render();
    pending[cat]++;
    supaRpc("rpc_roster_add", { p_pin: pin, p_table: cat, p_value: keyVal, p_sectors: [] }).then(function (row) {
      var idx = state.rosters[cat].indexOf(item);
      if (idx !== -1 && row) state.rosters[cat][idx] = row;
      render();
    }).catch(function (err) {
      state.rosters[cat] = state.rosters[cat].filter(function (x) { return x !== item; });
      handleWriteError(err, "שגיאה בהוספה — בדוק חיבור לאינטרנט ונסה שוב");
      render();
    }).then(function () { pending[cat]--; }, function () { pending[cat]--; });
  });
}
function rosterRemove(cat, keyVal) {
  var keyField = KEY_FIELD[cat];
  if (findIdx(state.rosters[cat], keyField, keyVal) === -1) return;
  requirePin(function (pin) {
    var idx = findIdx(state.rosters[cat], keyField, keyVal);
    if (idx === -1) return;
    var removed = state.rosters[cat][idx];
    state.rosters[cat].splice(idx, 1);
    render();
    pending[cat]++;
    supaRpc("rpc_roster_remove", { p_pin: pin, p_table: cat, p_value: keyVal }).catch(function (err) {
      state.rosters[cat].splice(idx, 0, removed);
      handleWriteError(err, "שגיאה במחיקה — נסה שוב");
      render();
    }).then(function () { pending[cat]--; }, function () { pending[cat]--; });
  });
}
function rosterToggleSector(cat, keyVal, sec) {
  var keyField = KEY_FIELD[cat];
  requirePin(function (pin) {
    var item = state.rosters[cat].filter(function (x) { return x[keyField] === keyVal; })[0];
    if (!item) return;
    var oldSectors = item.sectors;
    var has = oldSectors.indexOf(sec) !== -1;
    var newSectors = has ? oldSectors.filter(function (s) { return s !== sec; }) : oldSectors.concat([sec]);
    item.sectors = newSectors;
    render();
    pending[cat]++;
    supaRpc("rpc_roster_toggle_sector", { p_pin: pin, p_table: cat, p_value: keyVal, p_sector: sec }).then(function (row) {
      if (row && row.sectors) item.sectors = row.sectors;
      render();
    }).catch(function (err) {
      item.sectors = oldSectors;
      handleWriteError(err, "שגיאה בעדכון גזרות — נסה שוב");
      render();
    }).then(function () { pending[cat]--; }, function () { pending[cat]--; });
  });
}
function addGuardToRoster(name) { rosterAdd("guards", name); }
function removeGuardFromRoster(name) { rosterRemove("guards", name); }
function toggleGuardSector(name, sec) { rosterToggleSector("guards", name, sec); }
function addVehicleToRoster(plate) {

function removeVehicleFromRoster(plate) { rosterRemove("vehicles", plate); }

  ui.customStart = "";

  ui.form = { name: "", plate: "", radio: "", camera: "" };
  ui.record = null;
  render();
}
function addGuardToAssignment() {
  var f = ui.form;
  if (!f.name.trim() || !f.plate.trim() || !f.radio.trim() || !f.camera.trim()) return;
  ui.guards.push({ id: uid(), name: f.name, plate: f.plate, radio: f.radio, camera: f.camera });
  showToast(f.name + " נוסף לשיבוץ בהצלחה");
  ui.form = { name: "", plate: "", radio: "", camera: "" };
  render();
}
function removeGuardFromAssignment(id) {
  ui.guards = ui.guards.filter(function (g) { return g.id !== id; });
  render();
}
function finishAssignment() {
  if (ui.guards.length === 0) return;
  requirePin(function (pin) {
    var rec = {
      kabat: ui.selectedKabat, sector: ui.sector, shift: ui.shift, briefer: ui.briefer,
      sectorCommander: ui.sectorCommander, guards: ui.guards, timestamp: Date.now(), shiftDate: ui.shiftDate
    };
    ui.record = rec;
    ui.step = 6;
    state.history = [rec].concat(state.history);
    render();
    pending.shifts++;
    supaRpc("rpc_finish_shift", {
      p_pin: pin, p_kabat: rec.kabat, p_sector: rec.sector, p_shift: rec.shift,
      p_briefer: rec.briefer, p_sector_commander: rec.sectorCommander, p_guards: rec.guards
    }).then(function (row) {
      if (row) {
        rec.id = row.id;
        rec.timestamp = new Date(row.created_at).getTime();
        render();
      }
    }).catch(function (err) {
      if (err && err.isPinError) {
        setStoredPin(null);
        ui.persistWarning = "קוד הגישה שגוי או פג תוקף — הדוח מוצג כאן אך לא נשמר במאגר המשותף. יש לנעול ולפתוח מחדש עם הקוד הנכון.";
      } else {
        ui.persistWarning = "שמירת הדוח בשרת נכשלה — הדוח מוצג כאן אך לא נשמר במאגר המשותף.";
      }
      render();
    }).then(function () { pending.shifts--; }, function () { pending.shifts--; });
  });
}
function saveAndSend() {
  var f = ui.form;
  if (f.name.trim() && f.plate.trim() && f.radio.trim() && f.camera.trim()) {
    ui.guards.push({ id: uid(), name: f.name, plate: f.plate, radio: f.radio, camera: f.camera });
    ui.form = { name: "", plate: "", radio: "", camera: "" };
  }
  finishAssignment();
}

function renderDateRow() {
  if (ui.dateEditing) {
    return '<div class="date-edit-row"><input type="date" class="input date-input" id="shift-date-input" data-bind="shiftDate" value="' + esc(ui.shiftDate) + '">' +
      '<button class="btn-secondary" data-act="close-date-picker">סגור</button></div>';
  }
  return '<div class="date-display">📅 ' + esc(formatDateFromYMD(ui.shiftDate)) + (ui.selectedKabat ? ' · 👤 ' + esc(ui.selectedKabat) : "") + "</div>" +
    '<div><button class="btn-link" data-act="open-date-picker">📆 בחר תאריך אחר</button></div>';
}
function renderHeader() {
  return LOGOS_HTML +
    '<div class="eyebrow">מערכת ניהול כוח אדם · קב"טים</div>' +
    '<h1 class="title">לוח בקרת משמרות</h1>' +
    renderDateRow() +
    (ui.persistWarning ? '<div class="conn-note conn-warn"><span class="conn-dot"></span>' + esc(ui.persistWarning) + "</div>" : "");
}
function renderManageToggle() {
  var locked = !getStoredPin();
  return '<div class="manage-toggle-row">' +
    '<button class="history-toggle manage-toggle" data-act="toggle-manage">' +
    ICONS.settings + "ניהול רשימות (מאבטחים, רכבים, קשר, מצלמות)" + ICONS.chevronDown + "</button>" +
    (locked ? "" : '<button class="lock-btn" data-act="lock-again">🔒 נעל מחדש</button>') +
    "</div>";
}
function renderPinOverlay() {
  return '<div class="pin-overlay">' +
    '<div class="pin-box">' +
    '<div class="pin-title">🔒 קוד גישה לעריכה</div>' +
    '<div class="pin-sub">כדי להוסיף/למחוק פריטים ברשימות או לשמור שיבוץ, יש להזין את קוד הגישה המשותף לקב"טים.</div>' +
    '<input class="input" type="tel" inputmode="numeric" id="pin-input" placeholder="קוד גישה" autocomplete="off" data-enter-act="submit-pin">' +
    (ui.pinError ? '<div class="field-hint">' + esc(ui.pinError) + "</div>" : "") +
    '<div class="actions-row">' +
    '<button class="btn-primary" data-act="submit-pin"' + (ui.pinChecking ? " disabled" : "") + ">" + (ui.pinChecking ? "בודק…" : "אישור") + "</button>" +
    '<button class="btn-secondary" data-act="cancel-pin">ביטול</button>' +
    "</div></div></div>";
}
function renderSectorTags(current, onCat, onValue) {
  return '<div class="sector-tags">' + TOP_SECTORS.map(function (sec) {
    var active = current.indexOf(sec) !== -1;
    return '<button class="sector-tag' + (active ? " sector-tag-active" : "") + '" data-act="toggle-sector" data-cat="' + esc(onCat) + '" data-value="' + esc(onValue) + '" data-sector="' + esc(sec) + '">' + esc(sec) + "</button>";
  }).join("") + "</div>";
}
function renderManagePanel() {

        return '<div class="guard-manage-item"><div class="guard-manage-top"><span class="g-name" style="font-family:\'IBM Plex Mono\',monospace">' + esc(v.plate) + '</span>' +

          renderSectorTags(v.sectors, "vehicles", v.plate) + "</div>";
      }).join("")) + "</div></div>";

  var taggedHtml = TAGGED_CATS.map(function (cat) {
    var mono = TAGGED_MONO[cat];
    return '<div class="panel manage-col manage-col-guards"><h3>' + CATEGORY_LABELS[cat] + "</h3>" +

      '<div class="manage-list">' +
      (state.rosters[cat].length === 0 ? '<div class="h-meta">הרשימה ריקה</div>' :

  if (!el) return;
  var act = el.getAttribute("data-enter-act");
  if (act === "add-guard-roster") { addGuardToRoster(getVal("new-guard-name")); clearVal("new-guard-name"); }
  else if (act === "add-vehicle-roster") { addVehicleToRoster(getVal("new-vehicle-plate")); clearVal("new-vehicle-plate"); }
  else if (act === "add-tagged") { var cat = el.getAttribute("data-cat"); addTaggedItem(cat, getVal("new-" + cat)); clearVal("new-" + cat); }
  else if (act === "submit-pin") { submitPin(); }
});
root.addEventListener("change", function (e) {
  var el = e.target.closest("[data-bind]");
  if (!el) return;
  var bind = el.getAttribute("data-bind");
  if (bind === "briefer") ui.briefer = el.value;
  else if (bind === "sectorCommander") ui.sectorCommander = el.value;
  else if (bind === "shiftDate") { ui.shiftDate = el.value; ui.dateEditing = false; }
  else if (bind === "customStart") ui.customStart = el.value;
  else if (bind === "customEnd") ui.customEnd = el.value;
  else if (bind.indexOf("form.") === 0) ui.form[bind.slice(5)] = el.value;
  render();
});
loadAll();
setInterval(pollRefresh, 20000);
document.addEventListener("visibilitychange", function () { if (!document.hidden) pollRefresh(); });
})();
</script>
</body>
</html>
